<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LedgerView</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f4ee;
      --fg: #18201c;
      --muted: #5d675f;
      --link: #176246;
      --panel: #ffffff;
      --border: #d9d3c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101411;
        --fg: #eef3ed;
        --muted: #b4beb6;
        --link: #7ad0a4;
        --panel: #171d19;
        --border: #303932;
      }
    }
    body {
      margin: 0;
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 {
      font-size: clamp(2.25rem, 8vw, 4.5rem);
      line-height: 1;
      margin: 0 0 20px;
    }
    p {
      color: var(--muted);
      max-width: 640px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      color: var(--link);
      font-weight: 600;
    }
    nav a {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>LedgerView</h1>
    <p>LedgerView is a local-first personal finance and net worth tracker with a Mac source of truth and a fast iPhone companion dashboard.</p>
    <p>It is built for manual and CSV-first workflows, explicit data freshness, and user-controlled financial records.</p>
    <nav aria-label="LedgerView links">
      <a href="./privacy.html">Privacy Policy</a>
      <a href="./support.html">Support</a>
    </nav>
  </main>
</body>
</html>
